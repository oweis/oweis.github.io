<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script>
(function(){
  try{
    var t = localStorage.getItem('oweis-theme');
    if(!t){
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){
    document.documentElement.setAttribute('data-theme','dark');
  }
})();
</script>
<meta name="robots" content="noindex"/>
<meta name="referrer" content="strict-origin-when-cross-origin"/>
<meta name="theme-color" content="#13110e" media="(prefers-color-scheme: dark)"/>
<meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)"/>
<link rel="icon" type="image/svg+xml" href="/assets/logo/nested-o.svg?v=2"/>
<link rel="apple-touch-icon" href="/assets/logo/apple-touch-icon.png"/>
<title>404 — Oweis Yahya</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;800&amp;family=Instrument+Serif:ital@0;1&amp;family=Space+Grotesk:wght@500;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<style>
  :root[data-theme="dark"]{
    --c-bg:#13110e;--c-bg-2:#1c1a14;--c-ink:#ebe5d6;--c-ink-soft:#c8c1ae;--c-ink-muted:#8b8470;
    --c-accent:#e7a652;--c-accent-bright:#f3b969;--c-accent-on:#13110e;
    --c-rule:#4a4439;--c-glow:rgba(231,166,82,.35);color-scheme:dark}
  :root[data-theme="light"]{
    --c-bg:#f6f3ec;--c-bg-2:#ede8db;--c-ink:#15140f;--c-ink-soft:#3a3528;--c-ink-muted:#6b6552;
    --c-accent:#a3431f;--c-accent-bright:#b6532a;--c-accent-on:#fbf6e9;
    --c-rule:#bdb6a4;--c-glow:rgba(163,67,31,.25);color-scheme:light}
  *,:before,:after{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--c-bg);color:var(--c-ink);font-family:"Geist",ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100dvh;display:flex;align-items:center;justify-content:center;
    background-image:radial-gradient(900px 500px at 80% 0%,color-mix(in oklab,var(--c-accent) 7%,transparent),transparent 60%),
                     radial-gradient(circle at 2px 2px,color-mix(in oklab,var(--c-rule) 35%,transparent) 1px,transparent 0);
    background-size:auto,40px 40px}
  .wrap{padding:2rem;max-width:42rem;text-align:left}
  .meta{display:inline-flex;align-items:center;gap:.55rem;padding:.4rem .85rem;
    border:1px solid color-mix(in oklab,var(--c-accent) 30%,transparent);
    border-radius:9999px;background:color-mix(in oklab,var(--c-accent) 5%,transparent);
    font-family:"Space Grotesk",sans-serif;font-size:.7rem;
    letter-spacing:.16em;text-transform:uppercase;color:var(--c-ink-soft);font-variant-numeric:tabular-nums;margin-bottom:1.75rem}
  .meta::before{content:"";width:.4rem;height:.4rem;border-radius:9999px;background:#e05d44;box-shadow:0 0 12px rgba(224,93,68,.55)}
  h1{font-family:"Geist",sans-serif;font-weight:800;font-size:clamp(5rem,16vw,9rem);line-height:.92;letter-spacing:-.05em;
    color:var(--c-accent-bright);margin:0 0 1rem;font-variant-numeric:tabular-nums}
  h1 .slash{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;color:var(--c-accent);font-size:.55em;
    margin:0 .15em;vertical-align:.18em}
  p.lead{font-size:1.25rem;line-height:1.55;color:var(--c-ink);margin:0 0 .5rem;text-wrap:balance}
  p.lead em{font-family:"Instrument Serif",serif;font-style:italic;color:var(--c-accent);font-weight:400}
  p.path{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.85rem;color:var(--c-ink-muted);
    margin:0 0 2.5rem;word-break:break-all}
  .row{display:flex;gap:.75rem;flex-wrap:wrap}
  .btn-solid,.btn-ghost{display:inline-flex;align-items:center;gap:.5rem;font-family:"Space Grotesk",sans-serif;
    font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:.75rem;padding:1rem 2rem;
    border-radius:.5rem;text-decoration:none;transition:transform 200ms ease,filter 200ms ease,background-color 200ms ease,border-color 200ms ease}
  .btn-solid{background:var(--c-accent);color:var(--c-accent-on);box-shadow:0 6px 22px -10px var(--c-glow)}
  .btn-solid:hover{filter:brightness(1.06)}
  .btn-solid:active{transform:translateY(1px) scale(.985)}
  .btn-ghost{border:1px solid color-mix(in oklab,var(--c-accent) 28%,transparent);color:var(--c-accent)}
  .btn-ghost:hover{border-color:var(--c-accent);background:color-mix(in oklab,var(--c-accent) 6%,transparent)}
  .btn-ghost:active{transform:translateY(1px) scale(.985)}
  a:focus-visible{outline:2px solid var(--c-accent);outline-offset:3px}
</style>
</head>
<body>
<main class="wrap">
<span class="meta">Status · 404 not found</span>
<h1>4<span class="slash">/</span>04</h1>
<p class="lead">This page <em>doesn't exist</em> — or it moved while you weren't looking.</p>
<p class="path" id="path"></p>
<div class="row">
<a class="btn-solid" href="/">Back to home</a>
<a class="btn-ghost" href="/#contact">Email me instead</a>
</div>
</main>
<script>document.getElementById('path').textContent='~' + (location.pathname || '/');</script>
</body></html>
